name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check:syntax

      - name: Static contract check
        run: npm run check:static

      - name: Run tests
        run: npm test

      - name: Theme contrast check
        run: npm run check:themes

      - name: Tools smoke check
        # Windows 的默认 shell 是 pwsh，它把 /dev/null 当成真实文件路径
        # （C:\dev\null）而不是空设备，重定向会直接以 DirectoryNotFoundException 失败。
        # 显式用 bash，让这段重定向在三个平台上语义一致。
        shell: bash
        run: |
          node tools/flac-auto-metadata.cjs --help > /dev/null
          node tools/metadata-audit.cjs --help > /dev/null
          node tools/metadata-repair.cjs --help > /dev/null
          node tools/extract-flac-cover.cjs --help > /dev/null
          node tools/metadata-audit.cjs . > /dev/null
          node tools/metadata-audit.cjs . --fail-on-issues > /dev/null
          node tools/metadata-repair.cjs . > /dev/null
